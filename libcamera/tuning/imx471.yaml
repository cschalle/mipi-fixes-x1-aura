%YAML 1.1
---
# Sony IMX471 as fitted to the Lenovo ThinkPad X1 Carbon Gen 14.
#
# Black level is the sensor pedestal of 64 DN at 10 bits, in the 16 bit
# units the BlackLevel algorithm expects (64 << 6).
#
# Lens shading gains use 1024 for unity, as the rkisp1 tuning files do.
# The grids cover the full active pixel array; libipa resamples them for
# whatever the sensor reports as its analogue crop.
#
# Colour matrices are applied after white balance and each row sums to
# one, so a neutral input stays neutral.
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - LensShadingCorrection:
      # Polynomial rather than tabular: LscTable cannot resample its
      # grids for the sensor's analogue crop, and this sensor reads
      # out 3856x2176 of its 4656x3496 array.
      type: polynomial
      sets:
        - ct: 2694
          r:
            cx: 0.5
            cy: 0.5
            k0: 6.232229
            k1: 1.915956
            k2: -14.198143
            k3: 119.530090
            k4: -142.976535
          gr:
            cx: 0.5
            cy: 0.5
            k0: 6.920948
            k1: -19.683118
            k2: 85.355875
            k3: -81.816705
            k4: -2.060203
          gb:
            cx: 0.5
            cy: 0.5
