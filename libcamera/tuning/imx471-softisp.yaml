%YAML 1.1
---
# Sony IMX471 as fitted to the Lenovo ThinkPad X1 Carbon Gen 14.
#
# Black level is the sensor pedestal of 64 DN at 10 bits, in the 16 bit
# units the BlackLevel algorithm expects (64 << 6).
#
# Lsc coefficients are the plain floating point polynomial fit; libipa
# quantises them to UQ<2,6> itself once resampled for the sensor's
# analogue crop.
#
# Colour matrices are applied after white balance and each row sums to
# one, so a neutral input stays neutral.
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Lsc:
      # Polynomial rather than tabular: LscTable cannot resample its
      # grids for the sensor's analogue crop, and this sensor reads
      # out 3856x2176 of its 4656x3496 array.
      type: polynomial
      sets:
        - ct: 2694
          r:
            cx: 0.5
            cy: 0.5
            k0: 6.232229
            k1: 1.915956
            k2: -14.198143
            k3: 119.530090
            k4: -142.976535
          g:
            cx: 0.5
            cy: 0.5
            k0: 7.124488
            k1: -23.041254
            k2: 101.929473
            k3: -114.099067
            k4: 19.733260
          b:
            cx: 0.5
            cy: 0.5
            k0: 8.171521
            k1: -38.310003
            k2: 170.954282
            k3: -245.436970
            k4: 102.751629
        - ct: 2784
          r:
            cx: 0.5
            cy: 0.5
            k0: 5.226037
            k1: 11.073734
            k2: -74.125876
            k3: 252.645405
